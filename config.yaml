              - **Engineered** automated operational scripts (Python/Go) to eliminate manual system maintenance, reducing operational toil significantly.
              - **Orchestrated** service health monitoring via **Prometheus** and **Grafana**; proactively resolved critical incidents to maintain 99.9x% uptime SLA.
              - **Managed** hybrid Linux/Windows infrastructure, ensuring strict network security compliance and high availability.
          
      - company: "Microsoft"
